<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cathy's Mahjong</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Moves text (bottom-left) -->
    <div id="moves-display">Moves available: 0</div>

        <button id="info-btn">Info</button>

    <!-- Tile container (free-floating) -->
    <div id="board"></div>

    <script src="game.js"></script>
</body>
</html>
